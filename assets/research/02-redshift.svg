<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <!-- axes -->
  <g stroke="#1a1a18" fill="none">
    <line x1="36" y1="200" x2="296" y2="200" stroke-width="0.8" opacity="0.55"/>
    <line x1="36" y1="200" x2="36" y2="28" stroke-width="0.8" opacity="0.55"/>
  </g>
  <!-- gridlines -->
  <g stroke="#1a1a18" stroke-width="0.4" opacity="0.18" stroke-dasharray="2 3">
    <line x1="100" y1="28" x2="100" y2="200"/>
    <line x1="164" y1="28" x2="164" y2="200"/>
    <line x1="228" y1="28" x2="228" y2="200"/>
    <line x1="292" y1="28" x2="292" y2="200"/>
  </g>
  <!-- ticks -->
  <g stroke="#1a1a18" stroke-width="0.6" opacity="0.55">
    <line x1="36" y1="200" x2="36" y2="204"/>
    <line x1="100" y1="200" x2="100" y2="204"/>
    <line x1="164" y1="200" x2="164" y2="204"/>
    <line x1="228" y1="200" x2="228" y2="204"/>
    <line x1="292" y1="200" x2="292" y2="204"/>
  </g>
  <!-- shaded n(z) region -->
  <path d="M36,200 C70,198 96,90 128,62 C160,34 184,150 220,178 C256,196 280,200 296,200 Z"
        fill="#1a1a18" opacity="0.07"/>
  <!-- spec n(z) curve (solid) -->
  <path d="M36,200 C70,198 96,90 128,62 C160,34 184,150 220,178 C256,196 280,200 296,200"
        stroke="#1a1a18" stroke-width="1.5" fill="none"/>
  <!-- photometric n(z) (dashed, broader, shifted) -->
  <path d="M36,200 C76,196 110,108 148,86 C186,64 210,156 240,178 C268,196 286,200 296,200"
        stroke="#1a1a18" stroke-width="1" fill="none" stroke-dasharray="4 3" opacity="0.65"/>
  <!-- axis labels -->
  <g font-family="ui-monospace, 'IBM Plex Mono', monospace" fill="#1a1a18" opacity="0.55">
    <text x="160" y="222" font-size="10">z</text>
    <text x="20" y="116" font-size="10" transform="rotate(-90 20 116)">n(z)</text>
    <text x="32" y="216" font-size="8">0</text>
    <text x="96" y="216" font-size="8">1</text>
    <text x="160" y="216" font-size="8">2</text>
    <text x="224" y="216" font-size="8">3</text>
  </g>
</svg>
