<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
  <!-- 4x3 postage-stamp grid -->
  <g stroke="#1a1a18" stroke-width="0.6" fill="none" opacity="0.35">
    <rect x="28" y="22" width="60" height="60"/>
    <rect x="96" y="22" width="60" height="60"/>
    <rect x="164" y="22" width="60" height="60"/>
    <rect x="232" y="22" width="60" height="60"/>
    <rect x="28" y="90" width="60" height="60"/>
    <rect x="96" y="90" width="60" height="60"/>
    <rect x="164" y="90" width="60" height="60"/>
    <rect x="232" y="90" width="60" height="60"/>
    <rect x="28" y="158" width="60" height="60"/>
    <rect x="96" y="158" width="60" height="60"/>
    <rect x="164" y="158" width="60" height="60"/>
    <rect x="232" y="158" width="60" height="60"/>
  </g>
  <!-- galaxies as soft ellipses -->
  <g fill="#1a1a18" opacity="0.55">
    <ellipse cx="58" cy="52" rx="9" ry="6" transform="rotate(20 58 52)"/>
    <ellipse cx="126" cy="52" rx="6" ry="10" transform="rotate(-30 126 52)"/>
    <ellipse cx="194" cy="52" rx="11" ry="5"/>
    <ellipse cx="262" cy="52" rx="7" ry="7"/>

    <ellipse cx="54" cy="120" rx="7" ry="5"/>
    <ellipse cx="66" cy="124" rx="3.5" ry="3.5" opacity="0.7"/>
    <ellipse cx="126" cy="120" rx="10" ry="6" transform="rotate(50 126 120)"/>
    <ellipse cx="194" cy="120" rx="5" ry="9" transform="rotate(15 194 120)"/>
    <ellipse cx="258" cy="120" rx="5" ry="5"/>
    <ellipse cx="268" cy="124" rx="3" ry="4.5" opacity="0.7"/>

    <ellipse cx="58" cy="188" rx="8" ry="5"/>
    <ellipse cx="126" cy="188" rx="11" ry="4" transform="rotate(15 126 188)"/>
    <ellipse cx="194" cy="188" rx="5" ry="8" transform="rotate(-30 194 188)"/>
    <ellipse cx="262" cy="188" rx="7" ry="8" transform="rotate(40 262 188)"/>
  </g>
  <!-- stars (small crosses) -->
  <g stroke="#1a1a18" stroke-width="0.6" opacity="0.55">
    <line x1="76" y1="36" x2="80" y2="36"/><line x1="78" y1="34" x2="78" y2="38"/>
    <line x1="146" y1="70" x2="150" y2="70"/><line x1="148" y1="68" x2="148" y2="72"/>
    <line x1="244" y1="172" x2="248" y2="172"/><line x1="246" y1="170" x2="246" y2="174"/>
    <line x1="40" y1="206" x2="44" y2="206"/><line x1="42" y1="204" x2="42" y2="208"/>
  </g>
</svg>
