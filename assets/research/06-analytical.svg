<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Projected two-point expansion</title>
  <desc id="desc">A multi-line equation for projected two-point terms, aligned by the equality and plus signs.</desc>
  <style>
    .rule { fill: none; stroke: #1a1a18; stroke-opacity: 0.18; stroke-width: 0.8; }
    .guide { stroke: #1a1a18; stroke-opacity: 0.11; stroke-width: 0.55; stroke-dasharray: 1.5 3; }
    .eq { fill: #1a1a18; font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 17.2px; }
    .lhs { font-size: 18.8px; }
    .op { fill: #6f6b62; font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 18.8px; text-anchor: end; }
    .it { font-style: italic; }
    .sub { baseline-shift: sub; font-size: 9.4px; }
    .sup { baseline-shift: super; font-size: 9.4px; }
    .label { fill: #6f6b62; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 7.2px; letter-spacing: 0.08em; }
  </style>

  <rect x="19.5" y="19.5" width="281" height="201" class="rule"/>
  <line x1="48" y1="40" x2="272" y2="40" class="guide"/>
  <line x1="58" y1="65" x2="58" y2="188" class="guide"/>

  <text x="32" y="32" class="label">PROJECTED TWO-POINT TERMS</text>

  <text x="70" y="66" class="eq lhs">
    <tspan>&#x27E8;</tspan><tspan class="it">&#x03B4;</tspan><tspan class="sub">2D</tspan><tspan>(</tspan><tspan class="it">&#x03B8;</tspan><tspan>) </tspan>
    <tspan class="it">&#x03B4;</tspan><tspan class="sub">2D</tspan><tspan>(</tspan><tspan class="it">&#x03B8;</tspan><tspan>&#x2032;</tspan><tspan>)&#x27E9;</tspan>
  </text>

  <text x="52" y="100" class="op">=</text>
  <text x="70" y="100" class="eq">
    <tspan>&#x222B; d</tspan><tspan class="it">z</tspan><tspan> </tspan><tspan text-decoration="overline" class="it">n</tspan><tspan class="sup">2</tspan><tspan>(</tspan><tspan class="it">z</tspan><tspan>) </tspan>
    <tspan>&#x27E8;</tspan><tspan class="it">&#x03B4;</tspan><tspan> </tspan><tspan class="it">&#x03B4;</tspan><tspan>&#x2032;&#x27E9;</tspan>
  </text>

  <text x="52" y="130" class="op">+</text>
  <text x="70" y="130" class="eq">
    <tspan>2&#x222B; d</tspan><tspan class="it">z</tspan><tspan> </tspan><tspan text-decoration="overline" class="it">n</tspan><tspan class="sup">2</tspan><tspan>(</tspan><tspan class="it">z</tspan><tspan>) </tspan>
    <tspan>&#x27E8;</tspan><tspan class="it">&#x03B5;</tspan><tspan>(</tspan><tspan class="it">z</tspan><tspan>,</tspan><tspan class="it">&#x03B8;</tspan><tspan>)&#x27E9; </tspan>
    <tspan>&#x27E8;</tspan><tspan class="it">&#x03B4;</tspan><tspan> </tspan><tspan class="it">&#x03B4;</tspan><tspan>&#x2032;&#x27E9;</tspan>
  </text>

  <text x="52" y="160" class="op">+</text>
  <text x="70" y="160" class="eq">
    <tspan>&#x222B; d</tspan><tspan class="it">z</tspan><tspan> </tspan><tspan text-decoration="overline" class="it">n</tspan><tspan class="sup">2</tspan><tspan>(</tspan><tspan class="it">z</tspan><tspan>) </tspan>
    <tspan>&#x27E8;</tspan><tspan class="it">&#x03B5;</tspan><tspan>(</tspan><tspan class="it">z</tspan><tspan>,</tspan><tspan class="it">&#x03B8;</tspan><tspan>) </tspan>
    <tspan class="it">&#x03B5;</tspan><tspan>(</tspan><tspan class="it">z</tspan><tspan>,</tspan><tspan class="it">&#x03B8;</tspan><tspan>&#x2032;</tspan><tspan>)&#x27E9;</tspan>
  </text>

  <text x="70" y="190" class="op">&#x00D7;</text>
  <text x="90" y="190" class="eq">
    <tspan>&#x27E8;</tspan><tspan class="it">&#x03B4;</tspan><tspan> </tspan><tspan class="it">&#x03B4;</tspan><tspan>&#x2032;&#x27E9;</tspan>
  </text>
</svg>
